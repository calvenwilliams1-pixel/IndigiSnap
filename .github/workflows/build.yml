name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go-backend/go.sum

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            $HOME/android-sdk
          key: android-sdk-${{ runner.os }}-ndk25-v1

      - name: Setup Android SDK
        run: |
          if [ ! -d "$HOME/android-sdk/cmdline-tools/latest" ]; then
            mkdir -p $HOME/android-sdk/cmdline-tools
            cd $HOME/android-sdk/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
            rm commandlinetools-linux-11076708_latest.zip
          fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          if [ ! -d "$HOME/android-sdk/ndk/25.2.9519653" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          else
            echo "SDK components already cached"
          fi

      - name: Build Go libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cd go-backend
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang \
            go build -buildmode=c-shared \
            -o ../app/src/main/jniLibs/arm64-v8a/libindigisnap.so ./cmd/server
          CGO_ENABLED=1 GOOS=android GOARCH=arm \
            CC=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang \
            go build -buildmode=c-shared \
            -o ../app/src/main/jniLibs/armeabi-v7a/libindigisnap.so ./cmd/server

      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indigisnap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
