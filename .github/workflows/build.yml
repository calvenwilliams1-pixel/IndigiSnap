name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build Go libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cd go-backend
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64

          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang \
            go build -buildmode=c-shared \
            -o ../app/src/main/jniLibs/arm64-v8a/libindigisnap.so ./cmd/server

          CGO_ENABLED=1 GOOS=android GOARCH=arm \
            CC=$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang \
            go build -buildmode=c-shared \
            -o ../app/src/main/jniLibs/armeabi-v7a/libindigisnap.so ./cmd/server

      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indigisnap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
